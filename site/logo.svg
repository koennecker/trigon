<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trigon logo">
  <title>Trigon</title>
  <!-- Hellenistic coin seal: beaded border, inner ring, and the trigon
       (the trine triangle of traditional astrology) with star-sparkles
       at its vertices around a central point. -->
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#c9a227" stroke-width="3"
          stroke-dasharray="0.1 5.048" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.75"/>
  <polygon points="32,16.5 17.71,41.25 46.29,41.25" fill="none" stroke="#c9a227"
           stroke-width="2.2" stroke-linejoin="round"/>
  <g fill="#e3c566">
    <path transform="translate(32,16.5)" d="M0,-3.4 Q0.5,-0.5 3.4,0 Q0.5,0.5 0,3.4 Q-0.5,0.5 -3.4,0 Q-0.5,-0.5 0,-3.4 Z"/>
    <path transform="translate(17.71,41.25)" d="M0,-3.4 Q0.5,-0.5 3.4,0 Q0.5,0.5 0,3.4 Q-0.5,0.5 -3.4,0 Q-0.5,-0.5 0,-3.4 Z"/>
    <path transform="translate(46.29,41.25)" d="M0,-3.4 Q0.5,-0.5 3.4,0 Q0.5,0.5 0,3.4 Q-0.5,0.5 -3.4,0 Q-0.5,-0.5 0,-3.4 Z"/>
  </g>
  <circle cx="32" cy="33" r="2.2" fill="#c9a227"/>
</svg>
