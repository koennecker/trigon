# Desktop release — Windows and macOS
#
# Builds the desktop app on the Windows and macOS runners and uploads
# the artifacts to the GitHub Release for the tag. Linux artifacts are
# built on the developer machine and attached to the release separately.
#
# Triggered two ways:
#   - push a version tag (v*): builds and attaches to that release,
#     creating it if it does not exist
#   - manual dispatch: run the workflow with a tag input to attach
#     builds to the release for that tag
#
# The matrix is macos-latest and windows-latest. macOS builds target
# arm64 and are unsigned, so the operating system shows its standard
# security warning on first open.

name: Desktop Release

# The default GITHUB_TOKEN is read-only for contents on this repo;
# uploading release assets needs write access.
permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.0.1)"
        required: true
        default: "v0.0.1"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop/src-tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Trigon Desktop ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Desktop build of Trigon — the web app in a desktop shell, with profiles, settings, and saved charts stored in local SQLite. The Swiss Ephemeris runs in WebAssembly, as on the web. The web app is live at https://trigon.pages.dev."
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
