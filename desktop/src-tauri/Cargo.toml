[package]
name = "trigon-desktop"
version = "0.0.1"
description = "Trigon desktop app: Tauri wrapper with SQLite persistence"
authors = ["koennecker"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
